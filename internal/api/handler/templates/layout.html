{{define "layout"}}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBS Admin — {{.Title}}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
        .navbar {
            background: #1a1a2e; color: white; padding: 0 24px;
            display: flex; align-items: center; justify-content: space-between; height: 52px;
        }
        .navbar a { color: #ccc; text-decoration: none; margin-left: 20px; font-size: 14px; }
        .navbar a:hover { color: white; }
        .navbar .brand { font-weight: 600; font-size: 16px; color: white; margin-left: 0; }
        .container { max-width: 960px; margin: 32px auto; padding: 0 16px; }
        h1 { font-size: 22px; margin-bottom: 24px; }
        h2 { font-size: 16px; margin-bottom: 16px; color: #555; text-transform: uppercase; letter-spacing: .5px; }
        .card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .form-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .form-row label { min-width: 220px; font-size: 14px; }
        input[type=text], input[type=password], input[type=number], select {
            border: 1px solid #ddd; border-radius: 6px; padding: 8px 12px;
            font-size: 14px; width: 220px;
        }
        input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
        .btn {
            padding: 8px 18px; border: none; border-radius: 6px;
            font-size: 14px; cursor: pointer; font-weight: 500;
        }
        .btn-primary { background: #4f6ef7; color: white; }
        .btn-primary:hover { background: #3a58e0; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #219a52; }
        .btn-sm { padding: 5px 12px; font-size: 13px; }
        .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        .alert-error { background: #fdecea; color: #c0392b; border: 1px solid #f5c6cb; }
        .alert-success { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 10px 12px; border-bottom: 2px solid #eee; color: #666; font-weight: 600; font-size: 12px; text-transform: uppercase; }
        td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
        tr:last-child td { border-bottom: none; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-active { background: #d5f5e3; color: #1e8449; }
        .badge-revoked { background: #fdecea; color: #c0392b; }
        .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
    </style>
</head>
<body>
{{if .LoggedIn}}
<nav class="navbar">
    <a class="brand" href="/admin/">LBS Admin</a>
    <div>
        <a href="/admin/">Настройки</a>
        <a href="/admin/keys">API-ключи</a>
        <a href="/admin/sessions">Маршруты</a>
        <a href="/admin/logout">Выйти</a>
    </div>
</nav>
{{end}}
<div class="container">
{{template "content" .}}
</div>
</body>
</html>{{end}}
