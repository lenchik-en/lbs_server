version: "3.9"

services:
  locatedb:
    image: postgres:15
    container_name: lbs_locatedb
    restart: unless-stopped
    environment:
      POSTGRES_DB: locatedb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "55432:5432"
    volumes:
      - locatedb_data:/var/lib/postgresql/data

  updatedb:
    image: postgres:15
    container_name: lbs_updatedb
    restart: unless-stopped
    environment:
      POSTGRES_DB: updatedb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "55433:5432"
    volumes:
      - updatedb_data:/var/lib/postgresql/data

  server:
    build: .
    container_name: lbs_server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - locatedb
    environment:
      DATABASE_URL: postgres://admin:admin@locatedb:5432/locatedb?sslmode=disable

volumes:
  locatedb_data:
  updatedb_data:
