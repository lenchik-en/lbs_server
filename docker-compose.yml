services:
  locatedb:
    image: postgres:15
    container_name: lbs_locatedb
    restart: unless-stopped
    environment:
      POSTGRES_DB: locatedb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "55432:5432"
    volumes:
      - locatedb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d locatedb"]
      interval: 5s
      timeout: 3s
      retries: 5

  externaldb:
    image: postgres:15
    container_name: lbs_externaldb
    restart: unless-stopped
    environment:
      POSTGRES_DB: externaldb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "55434:5432"
    volumes:
      - externaldb_data:/var/lib/postgresql/data
      - ./external_data:/external_data
      - ./migrations/externaldb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d externaldb"]
      interval: 5s
      timeout: 3s
      retries: 5

  updatedb:
    image: postgres:15
    container_name: lbs_updatedb
    restart: unless-stopped
    environment:
      POSTGRES_DB: updatedb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "55433:5432"
    volumes:
      - updatedb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d updatedb"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: .
    container_name: lbs_server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      locatedb:
        condition: service_healthy
      externaldb:
        condition: service_healthy
      updatedb:
        condition: service_healthy

volumes:
  locatedb_data:
  updatedb_data:
  externaldb_data:
